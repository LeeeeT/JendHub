[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jend"
version = "0.1.0"
description = "Search engine for BendHub definitions"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "httpx2>=2.0.0",
    "lightgbm>=4.6",
    "numpy>=2.0",
    "pydantic>=2.12.0",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = ["httpx>=0.28", "pyright", "pytest", "ruff"]

[project.scripts]
jend-mirror = "jend.mirror:main"
jend-index = "jend.index:main"
jend-search = "jend.search:main"
jend-train = "jend.ranker:main"
jend-evaluate = "jend.evaluate:main"
jend-web = "jend.web:main"

[tool.ruff]
line-length = 100

[tool.pyright]
include = ["src"]
typeCheckingMode = "strict"
