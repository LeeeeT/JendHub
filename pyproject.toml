[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["bend2-lsp-rs"]

[tool.ruff.lint]
select = ["ALL"]
ignore = ["D", "COM812", "CPY", "TC", "EM", "TRY003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603", "S607", "PLR2004", "ARG002"]

[tool.pyright]
typeCheckingMode = "strict"
include = ["src", "tests"]

[tool.pytest]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
