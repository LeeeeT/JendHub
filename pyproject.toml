[project]
name = "jendhub"
version = "0.1.0"
authors = [
    { name = "LeeeeT", email = "me@LeeeeT.dev" }
]
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
    "numpy>=2.5.4",
]

[project.scripts]
jendhub = "jendhub.cli:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "respx>=0.23.1",
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["ALL"]
ignore = ["D", "COM812", "CPY", "TC", "EM", "TRY003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "ARG002"]

[tool.pyright]
typeCheckingMode = "strict"

[tool.pytest]
testpaths = ["tests"]
