[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["ALL"]
ignore = ["D", "COM812", "CPY", "TC", "EM", "TRY003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "ARG002"]

[tool.pyright]
typeCheckingMode = "strict"

[tool.pytest]
testpaths = ["tests"]
