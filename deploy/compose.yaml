name: jendhub

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  app:
    image: jendhub:latest
    restart: unless-stopped
    env_file: app.env
    environment:
      JEND_ORIGIN: https://jend.leeeet.dev
    volumes:
      - ./data:/data
    mem_limit: 512m
    logging: *logging

  tunnel:
    image: cloudflare/cloudflared:2026.9.3
    command: tunnel --no-autoupdate run
    restart: unless-stopped
    env_file: tunnel.env
    depends_on:
      - app
    mem_limit: 256m
    logging: *logging
