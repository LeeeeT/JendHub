name: jendhub

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

x-jendhub: &jendhub
  restart: unless-stopped
  logging: *logging
  environment: &environment
    JENDHUB_DATABASE_URL: postgresql://jendhub:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres/jendhub
    JENDHUB_QDRANT_URL: http://qdrant:6333
  healthcheck:
    test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')
    interval: 10s
    timeout: 5s
    retries: 5
  depends_on:
    migrate:
      condition: service_completed_successfully
    qdrant:
      condition: service_started

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    logging: *logging
    mem_limit: 384m
    environment:
      POSTGRES_USER: jendhub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: jendhub
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD, pg_isready, --username=jendhub]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.18.2
    restart: unless-stopped
    logging: *logging
    mem_limit: 256m
    environment:
      QDRANT__TELEMETRY_DISABLED: "true"
    volumes:
      - qdrant:/qdrant/storage

  migrate:
    image: jendhub-syncer:latest
    entrypoint: [jendhub, migrate]
    logging: *logging
    environment: *environment
    depends_on:
      postgres:
        condition: service_healthy

  syncer:
    <<: *jendhub
    image: jendhub-syncer:latest
    mem_limit: 192m

  worker:
    <<: *jendhub
    image: jendhub-worker:latest
    mem_limit: 512m
    environment:
      <<: *environment
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:?set OPENROUTER_API_KEY}
    volumes:
      - library:/data/library

  site:
    <<: *jendhub
    image: jendhub-site:latest
    mem_limit: 256m
    environment:
      <<: *environment
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:?set OPENROUTER_API_KEY}
      JENDHUB_SITE_URL: ${JENDHUB_SITE_URL:?set JENDHUB_SITE_URL}
      JENDHUB_CLIENT_IP_HEADER: ${JENDHUB_CLIENT_IP_HEADER:-}

  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    logging: *logging
    mem_limit: 192m
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus:/prometheus
    ports:
      - "127.0.0.1:${JENDHUB_PROMETHEUS_PORT:-9090}:9090"

  tunnel:
    image: cloudflare/cloudflared:2026.9.3
    profiles: [public]
    command: tunnel --no-autoupdate run
    restart: unless-stopped
    logging: *logging
    mem_limit: 128m
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      site:
        condition: service_healthy

volumes:
  postgres:
  qdrant:
  library:
  prometheus:
